name: Docker CI

on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'src/**'
      - '.github/workflows/docker-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'src/**'
      - '.github/workflows/docker-ci.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Read package version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          IFS=. read -r MAJOR MINOR _ <<< "${VERSION}"
          IMAGE="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=${VERSION}"
            echo "major=${MAJOR}"
            echo "minor=${MINOR}"
            echo "image=${IMAGE}"
          } >> "$GITHUB_OUTPUT"
          echo "Package version: ${VERSION}"
          echo "Image: ${IMAGE}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          provenance: false
          sbom: false
          build-args: |
            INSTALL_CHROME=true
          tags: hound-mcp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d \
            --name hound-test \
            --shm-size=1gb \
            -p 8765:8765 \
            hound-mcp:test

      - name: Wait for healthcheck
        run: |
          timeout 60 bash -c 'until docker inspect --format="{{.State.Health.Status}}" hound-test | grep -q "healthy"; do sleep 2; done'
          echo "Container is healthy"

      - name: Check MCP endpoint
        run: |
          sleep 5  # Give server time to fully start
          curl -sf http://localhost:8765/mcp > /dev/null 2>&1 || curl -sf -o /dev/null http://localhost:8765/mcp || true

      - name: Run tests inside container
        run: |
          docker exec hound-test python -m pytest tests/ -q --tb=short -x || true

      - name: Cleanup
        if: always()
        run: |
          docker stop hound-test || true
          docker rm hound-test || true

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE="${{ steps.version.outputs.image }}"
          VERSION="${{ steps.version.outputs.version }}"
          MAJOR="${{ steps.version.outputs.major }}"
          MINOR="${{ steps.version.outputs.minor }}"

          docker tag hound-mcp:test "${IMAGE}:${VERSION}"
          docker tag hound-mcp:test "${IMAGE}:${MAJOR}.${MINOR}"
          docker tag hound-mcp:test "${IMAGE}:${MAJOR}"
          docker tag hound-mcp:test "${IMAGE}:latest"

          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:${MAJOR}.${MINOR}"
          docker push "${IMAGE}:${MAJOR}"
          docker push "${IMAGE}:latest"

          echo "Pushed:"
          echo "  ${IMAGE}:${VERSION}"
          echo "  ${IMAGE}:${MAJOR}.${MINOR}"
          echo "  ${IMAGE}:${MAJOR}"
          echo "  ${IMAGE}:latest"
